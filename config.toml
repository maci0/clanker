# Every key a [models."<provider>/<model>"] entry takes. The table key carries
# the provider prefix and `provider` names it again; both are checked against
# each other at load, so a typo is a startup error rather than a wrong route.
#
# [models."example/example-pro"]
# provider = "example"           # required, must match the key's prefix
# context_window = 131072        # input + output, sizes compaction budgets
# max_tokens = 1024              # per-request completion cap
# temperature = 0.2
# top_p = 0.95                   # generally set instead of temperature, not
#                                # alongside: both narrow the same distribution
# reasoning_effort = "low"       # none | low | medium | high | max; unset omits
#                                # the field from the request entirely
# display = "vendor/example-pro" # what to call it in the UI when the wire id is
#                                # not what people call it. Display only.
# cost_per_1m_input = 0.14       # USD, for run cost accounting
# cost_per_1m_output = 0.28
# capabilities = ["thinking", "tool_use", "image_in", "video_in", "audio_in"]
# category = "fast"              # free-form grouping for the model pickers
#                                # (flagship, fast, reasoning, cheap, ...)

