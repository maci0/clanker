default_provider = "moonshotai"

# Every key a [providers.<name>] section takes. The four below are the ones
# these entries use; the rest are commented out here rather than repeated on
# each provider, since most configs never need them.
#
#   kind             openai_compat (default) | anthropic | vertex_anthropic
#                    | vertex | azure_openai | gemini
#   base_url         required
#   api_key_env      name of the env var holding the key, never the key itself
#   default_model    which [models."<name>/..."] entry is active; with exactly
#                    one model for the provider it is inferred
#
# [providers.example]
# kind = "openai_compat"
# base_url = "https://api.example.com/v1"
# api_key_env = "EXAMPLE_API_KEY"
# default_model = "example-pro"
#
# # api_key | oauth_static | oauth_refresh. Overrides the kind's own
# # auto-detection, which is needed only where a provider's keys and OAuth
# # tokens are not distinguishable by shape -- guessing wrong sends the secret
# # on the wrong header.
# auth = "api_key"
#
# # Endpoint path override. Defaults per kind: /chat/completions for
# # openai_compat, /v1/messages for anthropic.
# path = "/chat/completions"
#
# # This provider's own ceiling for `providers check`, overriding
# # agent.provider_check_timeout_seconds. Exists because one config mixes a LAN
# # endpoint that either answers in a blink or is switched off with hosted ones
# # that legitimately take seconds, and one number cannot be short for both.
# # 0 = no ceiling.
# check_timeout_seconds = 3
#
# # Self-imposed requests per minute for every model on this provider.
# # A model's own rpm is a separate cap, not an override of this one.
# rpm = 40
#
# # Wire encoding for tools and the reasoning knob, for endpoints that
# # deviate from the flat OpenAI shape. A model's own setting wins.
# # tool_schema: "openai" (default) or "none" (omit the tools array).
# # thinking_schema: "reasoning_effort" (default flat field), "reasoning"
# # (OpenRouter nest), "thinking" (GLM toggle), or "none" (omit).
# tool_schema = "openai"
# thinking_schema = "reasoning_effort"
#
# # Parse-side reasoning override: "auto" (the kind's native field),
# # "think_tag" (pull a leading <think>...</think> out of the content,
# # the local-vLLM DeepSeek shape), or "none" (discard reasoning).
# reasoning_format = "auto"
#
# # vertex and vertex_anthropic: the GCP project and region serving the
# # model. Credential is service_account_file, gcloud ADC
# # (`gcloud auth application-default login`), or api_key_env.
# # kind = "vertex" is Gemini by default and Claude when the model id
# # starts with claude.
# project = "my-gcp-project"
# location = "us-east5"
# service_account_file = "/path/to/sa.json"
#
# # azure_openai only. The api-version query. Empty uses 2024-10-21.
# api_version = "2024-10-21"


# NVIDIA build (integrate.api.nvidia.com) — OpenAI-compatible wire
[providers.nvidia]
kind = "openai_compat"
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"

# Table key is <our provider name>/<NVIDIA's own catalog SKU>. NVIDIA's NIM
# catalog hosts many vendors under one namespace and prefixes each model with
# its own vendor slug ("z-ai/", "meta/", "nvidia/" for their first-party
# models), so a three-segment key like this is normal, not a typo — see
# config.local.toml's nvidia/nvidia/nemotron-... entry for the same shape.
[models."nvidia/z-ai/glm-5.2"]
provider = "nvidia"
context_window = 131072
max_tokens = 16384
capabilities = ["thinking", "tool_use"]


# Vendors. Name is the catalog vendor id, never a model family.
[providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

[providers.deepseek]
kind = "openai_compat"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"

[providers.google]
kind = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta"
api_key_env = "GOOGLE_API_KEY"

[providers.meta]
kind = "openai_compat"
base_url = "https://api.meta.ai/v1"
api_key_env = "META_AI_API_KEY"

[providers.moonshotai]
kind = "openai_compat"
base_url = "https://api.moonshot.ai/v1"
api_key_env = "KIMI_API_KEY"

[providers.openai]
kind = "openai_compat"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

# Local runtimes. Put a LAN URL in config.local.toml if the host is not this box.
[providers.ollama]
kind = "openai_compat"
base_url = "http://127.0.0.1:11434/v1"

[providers.vllm-local]
kind = "openai_compat"
base_url = "http://127.0.0.1:8000/v1"

# Every key a [models."<provider>/<model>"] entry takes. The table key carries
# the provider prefix and `provider` names it again; both are checked against
# each other at load, so a typo is a startup error rather than a wrong route.
#
# [models."example/example-pro"]
# provider = "example"           # required, must match the key's prefix
# id = "example-pro"             # wire SKU when the table key is a local alias
#                                # (two keys can share an id with different temps)
# context_window = 131072        # omit to take models.dev limit.context
# max_tokens = 1024              # omit to take models.dev limit.output
# temperature = 0.2
# top_p = 0.95                   # generally set instead of temperature, not
#                                # alongside: both narrow the same distribution
# reasoning_effort = "low"       # none | low | medium | high | max; unset omits
#                                # the field from the request entirely
# display = "vendor/example-pro" # omit to take the models.dev display name
# cost_per_1m_input = 0.14       # omit to take models.dev cost.input
# cost_per_1m_output = 0.28      # omit to take models.dev cost.output
# capabilities = ["thinking", "tool_use", "image_in", "video_in", "audio_in"]
#                                # omit to take models.dev reasoning/tool_call/
#                                # modalities
# category = "fast"              # free-form grouping for the model pickers
#                                # (flagship, fast, reasoning, cheap, ...)
# rpm = 40                       # self-imposed requests per minute; omit = none
# tool_schema = "openai"         # or "none": omit the tools array for this model
# thinking_schema = "reasoning_effort"  # or "reasoning" / "thinking" / "none"
# reasoning_format = "auto"      # or "think_tag" / "none": response parse side
# base_url = "http://127.0.0.1:8000/v1"  # endpoint override for this model only
# path = "/chat/completions"     # endpoint path override for this model only
#
# One default model per provider. Extra SKUs go in config.local.toml.
# Context, max output, cost, display, and capabilities are filled from
# the models.dev snapshot when omitted; a written value always wins.

[models."anthropic/claude-opus-5"]
provider = "anthropic"

[models."deepseek/deepseek-v4-pro"]
provider = "deepseek"

[models."google/gemini-3.6-flash"]
provider = "google"

[models."meta/muse-spark-1.2"]
provider = "meta"

[models."moonshotai/kimi-k3"]
provider = "moonshotai"

[models."openai/gpt-5.6"]
provider = "openai"

[models."ollama/qwen3.5"]
provider = "ollama"
context_window = 32768

[models."vllm-local/deepseek-v4-flash"]
provider = "vllm-local"
context_window = 512000

[agent]
# Matches the struct default in src/config.zig. Kept in step deliberately:
# an explicit value here silently overrides the default, so a raise there
# does nothing for anyone running from this checkout unless it lands here too.
max_iterations = 50
# Completed turns a `/goal` loop may start before it reports a blocked budget
# outcome. Counts whole turns, where max_iterations counts steps inside one.
max_goal_turns = 50
# Ceiling on one provider's turn in `providers check`, so an endpoint that is
# switched off costs the sweep this instead of the OS connect timeout. Override
# per provider with `check_timeout_seconds` in its own section.
provider_check_timeout_seconds = 10
tools_dir = "tools/manifests"
skills_dir = "skills"
system_prompt_file = "skills/SYSTEM.md"
learnings_file = "state/learnings.md"
workflows_dir = "workflows"
chains_dir = "chains"
# TUI slash-command plugins (PRD 0012): {command, help, tool}.json files that
# append slash commands to the REPL, each dispatching to a sandboxed tool.
# Enabled via state/tui_plugins.json (enabled-list, default off).
tui_plugins_dir = "tui-plugins"
# CLI plugins (PRD 0012 Tier 1): {command, description, tool}.json files that
# become `clanker <command>` subcommands dispatching to a sandboxed tool with
# the remaining argv. Enabled via state/cli_plugins.json (enabled-list,
# default off). Tier 2 (clanker-<name> on PATH) needs no directory.
cli_plugins_dir = "cli-plugins"
sandbox_root = "."
# Allow a component of an already-granted sandbox path to be a symlink.
# Following a link out of the sandbox root is a known security risk, so this is
# off unless you ask for it: with it on, a link planted inside a granted prefix
# reaches whatever it points at. Turn it on when a granted prefix deliberately
# lives elsewhere -- a `state/` symlinked into backed-up storage, where leaving
# it off refuses every guest read and write under state/. See ADR 0017.
sandbox_follow_symlinks = false
seed = 0
# 0 = compact when history reaches half the model context window; a positive
# value is a byte cap converted to tokens (see docs/configuration.md).
compact_threshold_bytes = 0
# Large tool results are shortened only in the next provider request; saved
# session transcripts retain the exact original. Set threshold to 0 to disable.
tool_result_prune_bytes = 8192
tool_result_prune_head_bytes = 4096
tool_result_prune_tail_bytes = 1024
# Consecutive canonical-equivalent tool calls receive advisory reminders at
# these counts. Excluded patterns are transparent: they do not reset a chain.
repeat_tool_thresholds = [3, 5, 8]
repeat_tool_exclude = ["todo_add", "todo_close", "todo_list"]
# Consecutive identical calls after which the turn fails instead of being
# reminded again. The reminders above are advice; this is the terminal
# counterpart. 0 disables it.
repeat_tool_abort_threshold = 5
# Deadlines on the model call itself. Without them a provider that accepts the
# connection and then says nothing hangs the run forever: std.http.Client has
# no read timeout, and no retry fires because a call that never returns never
# produces an error. Both are bounded by default (900000 / 120000); the values
# below restate that default, and 0 on either is the explicit opt-out that
# leaves the clock unbounded.
#
# request_timeout_ms bounds one non-streaming completion end to end, and the
# wait for the first bytes of a streaming one. Keep it well above the slowest
# legitimate answer -- on a reasoning model the whole trace is generated before
# the response arrives -- because on the non-streaming path it does cap total
# generation time.
request_timeout_ms = 900000
# stream_idle_timeout_ms bounds the gap between reads once a stream is
# flowing. It is separate because a healthy stream may run far past any
# whole-call ceiling; what it does not do is fall silent mid-answer.
stream_idle_timeout_ms = 120000
git_remote_ops = false
# Session kinds that isolate in a git worktree by default, as if that mode's
# worktree/goal_worktree were "yes": any of "run", "goal", "tui", "schedule".
# Empty leaves every mode on its historical default. An explicit --worktree or
# --no-worktree still wins.
git_worktree_on = []
exec_pattern_allow = []
# Extra commands the REPL's `!cmd` escape may run, on top of the union of every
# tool's exec_allow. Empty = the escape can run exactly what the tools can.
repl_exec_allow = []

# The rest of [agent], commented out at its built-in default. Uncommenting a
# line pins it: the default stops applying, including a later change to it.
# The two uncommented lines below (confirm_writes, fallback_providers) are
# active pins on purpose, not defaults restated: their built-in defaults are
# "never" and an empty chain respectively, and these override both.
#
# Conversation budgeting. compact_threshold_bytes above is the byte-based
# trigger; these are the token-based ceilings.
# max_tokens_per_turn = 4096     # per-turn input cap; history compacts first
# max_history_tokens = 16000     # total history budget before old turns go
# max_total_tokens = 200000      # unset (the default) = no ceiling at all
#
# Tool schemas. With forty-odd tools the full schemas are several thousand
# tokens in every request, and most are unwanted on most turns; the catalog
# sends the hot ones and lets the model ask for the rest by name.
# tool_catalog = true
# hot_tools = 10                 # how many stay loaded unasked (measured, not picked)
#
# Paths. Empty global_instructions_file means $HOME/.agents/AGENTS.md when HOME
# is set; the project-root AGENTS.md is separate and always read.
# global_instructions_file = ""
# state_dir = "state"            # chatroom logs, run records, cursors
#
# git_commit = true              # commit promoted improvements
#
# ask_timeout_seconds = 120      # serve-side ask_user wait; the wait holds a
#                                # connection thread, so it has to be bounded
#
# never | browser | always. Gate write-capable tool calls on a human's
# allow/deny. Only the serve path reads it today, so `always` behaves like
# `browser` until the REPL grows a prompt for it. Runs with no human channel
# (headless, improve, sub-agents) are never gated whatever this says.
confirm_writes = "browser"
#
# Ordered providers tried after the selected one cannot serve a request.
# Either spelling works; a bare string becomes a one-entry chain.
fallback_providers = ["deepseek", "openai"]
# fallback_provider = "deepseek"
#
# Per-turn classifier that picks a reasoning_effort. Off until a calibration
# eval justifies it. Empty model = cheapest configured provider by input cost.
# auto_thinking = false
# thinking_classifier_model = ""
# thinking_classifier_timeout_ms = 3000
#
# auto | yes | no. Whether a run isolates itself in a git worktree without
# being asked. `auto` is the historical behaviour: off for a plain typed run,
# on for --goal and scheduled runs. An explicit --worktree/--no-worktree still
# wins over both.
# worktree = "auto"
# goal_worktree = "auto"
# git_worktree_on = []           # modes that isolate by default: run, goal, tui, webui
# isolated_cli = false           # plain `clanker run`: no active-goal steering, own worktree
# isolated_tui = false           # terminal REPL: own worktree for its session
# isolated_webui = false         # Web UI chats: no active-goal steering, own worktree

[instance]
name = "clanker"
id = "main"

# What `clanker serve` binds, for a deployment that cannot pass flags.
# CLANKER_HOST / CLANKER_WEBUI_PORT / CLANKER_PROXY_PORT override these, and
# --host / --webui-port / --serve-as / --proxy / --no-proxy / --proxy-port
# override those in turn. Commented out because the default (loopback, 17921)
# is the one that is safe unattended.
# [serve]
# host = "0.0.0.0"
# webui_port = 17921
# serve_as = ["clanker.lan"]
# proxy = false
# # proxy_port = 17922
# # proxy_token_env = "CLANKER_PROXY_TOKEN"
# # proxy_first_byte_timeout_s = 300
# # proxy_idle_timeout_s = 60
# # [serve.proxy_aliases]
# # "claude-4-sonnet" = "anthropic/claude-sonnet-4-20250514"
# # sonnet = "moonshotai/kimi-k3"   # Claude Code "…sonnet…" → this backend
# # haiku = "moonshotai/kimi-k3"
# # opus = "anthropic/claude-opus-5"

# Outbound only: a peer is a URL this instance connects to, never a port it
# opens. `dummy-down` points at the discard port on purpose, so `phonebook`
# and `notify` have a reachable-but-refused case to exercise.
[[peers]]
name = "dummy-down"
url = "http://127.0.0.1:9"

[modules]
mcp = true
mcp_client = false
acp = false
peers = true
a2a = true
webui = true
graphs = true
sessions = true
goal = true
# Attach the newest active goal to a run when no --goal is given. Turning this
# off keeps the goal module on -- explicit goals, /goal and tracking all still
# work -- but stops runs steering themselves toward whatever is newest.
goal_auto_steer = true
token_budget = true
streaming = true
dotenv = true
# REPL/serve self-restart when the binary is rebuilt.
hot_reload = true
# Record usage patterns and feed them into the ROADMAP's Autolearn section.
autolearn = true
# Let the agent delegate work to nested sub-agent runs.
subagents = true
# Persist reasoning traces and expose them to the agent.
rlm = true
# Attach images to messages (image tool + image_url blocks).
multimodal = true
chatrooms = true
token_stats = true
# Per-session append-only event store (SQLite): system prompts, tool
# calls/results, reasoning, subagent launches and context injections as an
# INSERT-only event stream per session, replicable to mesh peers.
session_events = true

[chatrooms]
on = true
rooms = ["dev"]
max_history = 500

# Peer notifications: whether events are pushed to the [[peers]] above, and
# under what topic. Both at their defaults.
# [notify]
# on = true
# topic = "clanker"

# External MCP servers this clanker may consume tools from. Configuration is
# live now (validated at load, managed from System -> MCP servers in the web
# UI); the client bridge that actually connects is PRD 0032 and stays behind
# modules.mcp_client until it lands. transport "stdio" spawns `command` with
# `args`/`env` ("KEY=value" pairs) in `cwd`; transport "http" speaks
# streamable HTTP at `url` with `headers` ("Name: value" lines).
# [mcp_servers.github]
# transport = "stdio"
# command = "github-mcp-server"
# args = ["stdio"]
# env = ["GITHUB_TOKEN=..."]
# cwd = ""
# url = ""
# headers = []
# tool_call_timeout_ms = 60000

# Hosts the research tools may reach. The sandbox denies a tool the network
# unless its own descriptor names the host, so this is the config-side channel
# for that: every name here is added to fetch_web's and web_search's allowlists
# at load, which makes granting a site a config edit rather than a manifest
# edit. Hostnames only -- no scheme, no path. Entries are glob-matched, so
# "*.ziglang.org" works and a bare "*" allows any host at all.
# [web]
# allow = ["docs.rs", "*.ziglang.org"]

# The self-improvement loop (`clanker improve-self`). Everything here is at its
# built-in default; the two `false` ones are the opt-ins.
# [improve]
# max_context_bytes = 0          # 0/unset = size the context from the model's
#                                # own window. A fixed number silently keeps a
#                                # 1M-window model on whatever diet it names.
# capability_gate = true         # run the staged tree's task evals before
#                                # promoting: one agent run each, and the price
#                                # of catching a patch that compiles, passes
#                                # every unit test, and breaks a tool
# inert_gate = true              # reject a proposal whose only effect is code
#                                # nothing can reach. Every other gate asks if a
#                                # change is safe, and a no-op is maximally safe
# plan_phase = true              # list and dedup candidates before patching,
#                                # instead of letting the patch call pick its
#                                # own idea and write it blind in one breath
# max_consecutive_test_only = 3  # test-only promotions in a row before the next
#                                # is refused. 0 disables
# max_context_requests = 3       # times the model may ask for unseen files
#                                # instead of producing a patch. 0 disables
# max_cache_bytes = 4294967296   # ceiling on the zig build cache, checked each
#                                # attempt. Zig never prunes it; unbounded it
#                                # reached 72 GB here and filled the disk. 0 off
# arena_advisory = false         # advisory Arena verdict per proposal. Logged,
#                                # never consulted: a gate a self-authored
#                                # proposal could learn to persuade is not a gate
# eval_provider = "deepseek"     # provider the capability evals run on. They are
#                                # mechanical (call a tool, read a field), so a
#                                # cheap model grades them the same as a frontier
#                                # one. Unset = the staged tree's own default

# Post-turn critique by a second model. Off by default, and fails open: an
# advisor that errors or times out never blocks the turn. Distinct from
# improve.arena_advisory, which lives inside the improve engine.
# [advisor]
# enabled = false
# provider = ""                  # empty = the run's own provider
# model = ""
# scope = "turn"
# context_turns = 3
# timeout_ms = 5000

# Turn-time self-repair: watch the stream for a pattern and inject a
# correction, up to a cap, rather than letting a turn fail on a known-shaped
# mistake. One conservative rule catches the most common mid-stream error.
[ttsr]
max_retries_per_turn = 3
buffer_bytes = 4096

[[ttsr.rules]]
name = "no-such-tool"
pattern = "unknown tool"
inject = "That tool does not exist. List the tools you have and pick one."
max_fires = 1

[[ttsr.rules]]
name = "invalid-schema"
pattern = "invalid"
inject = "Re-check your available tool schemas before retrying. Verify the exact parameter names and types each tool expects."
max_fires = 1

[[ttsr.rules]]
name = "zig-compile-error"
pattern = "error:*expected"
inject = "That is a Zig compile error. Read the full diagnostic, identify the syntax or type issue it names, and correct the source before retrying."
max_fires = 1

[[ttsr.rules]]
name = "zig-no-member"
pattern = "no member named"
inject = "That symbol does not exist on the referenced type. Verify the exact field or method name against the declaration, check for a missing import, and correct the reference before retrying."
max_fires = 1

[[ttsr.rules]]
name = "provider-rate-limit"
pattern = "rate limit"
inject = "The provider is applying rate limits. Reduce request frequency or wait before retrying; if another model is available, switch to it."
max_fires = 2

# Persistent eval kernels: a long-lived subprocess an eval can talk to instead
# of paying process startup per case. Off by default and worth leaving off
# unless you need it -- a kernel is unsandboxed, with the host's own ambient
# filesystem permission.
# [kernel]
# enabled = false
# max_output_bytes = 65536
# cleanup_delay_ms = 5000

# Debug Adapter Protocol client. Off by default -- an adapter is an
# unsandboxed subprocess (lldb-dap, debugpy, dlv). Same gate as [kernel].
# [debug]
# enabled = false
# disconnect_timeout_ms = 3000
# launch_timeout_ms = 15000
#
# [debug.adapters]
# [debug.adapters.lldb]
# command = ["lldb-dap"]
#
# [debug.adapters.python]
# command = ["python3", "-m", "debugpy.adapter"]
#
# [debug.adapters.go]
# command = ["dlv", "dap"]

# TCP peer mesh (PRD 0011). Off by default. Only `clanker serve` binds.
# [modules]
# mesh = false
#
# [mesh]
# listen_host = "127.0.0.1"
# listen_port = 7420
# ping_interval_seconds = 15
# admission = "allowlist"
# max_members = 32
# max_pending_joins = 8
# prompt_timeout_seconds = 120
# max_frame_bytes = 1048576
# max_file_bytes = 33554432
# file_chunk_bytes = 32768

# Retrieval memory. `hybrid` combines the keyword index with vector search;
# `keyword` skips the vector pass. Chunking and the embedder are the memory
# tool's own inputs, not config.
# [memory]
# backend = "hybrid"
#
# [memory.vector]
# top_k = 5
# threshold = 0.35

[hooks]
# Claude Code-compatible lifecycle hooks. Off means hooks.json is not read.
enabled = false
config_path = "hooks.json"
default_timeout_ms = 60000

[kernel]
# Python cell execution for the `kernel` tool. Off by default. When on, cells
# run under a WASI sandbox via the interpreter scripts/setup-python-wasi.sh
# fetches; if that binary is missing, cells fall back to an UNSANDBOXED host
# python3 subprocess and log a deprecation warning (this fallback will be
# removed).
enabled = false
max_output_bytes = 65536
cleanup_delay_ms = 5000
python_wasi_binary = "vendor/python-wasi/bin/python-3.12.0.wasm"
python_wasi_stdlib = "vendor/python-wasi/usr/local/lib"
python_wasi_fuel = 5000000000
python_wasi_timeout_ms = 30000
python_wasi_max_memory_bytes = 268435456

[tui]
# The REPL mascot: a small robot that runs around the input box. Purely
# decorative and off by default, so every key here is commented out -- the
# built-in default is already `off`, and uncommenting any of them is opt-in.
#
# Try it for one session without editing this file at all:
#
#   clanker repl --mascot            # loop, the bare default
#   clanker repl --mascot=input --mascot-size=small
#
# Modes:
#
#   off    no mascot, no rows claimed (the default)
#   type   runs right as you type, stands still when you stop, and turns
#          upside down while you backspace
#   loop   runs across the width, off the right edge, back in from the left
#   place  runs on the spot in the bottom-right corner above the box
#   input  runs on the spot *inside* the input box, at its bottom right. At its
#          default size the box stays the height it is with no mascot at all;
#          a bigger size grows it. Either way the text field is narrowed, so
#          the robot never sits on top of what you are typing. Costs no
#          transcript rows, which makes it the cheapest mode on a short
#          terminal.
#
# Every mode except `input` reserves rows above the composer: 1 to 10 depending
# on mascot_size. `--mascot` overrides this key for one session, and
# `--mascot=off` forces it off again.
#
# The renderer is picked automatically from what the terminal answers to a
# capability query, never from $TERM or a terminal name: kitty graphics first,
# then sixel, then unicode half-blocks. Kitty and sixel both show the original
# artwork in the same number of cells; half-blocks are a two-samples-per-cell
# approximation of it. There is no setting to force one -- a terminal that
# claims a protocol it cannot do would leave the mascot invisible.
#
# Skipped, not clipped, on a terminal too small for the chosen size.
# mascot = "off"

# Canonical values: mini, xsmall, small, medium or large. `tiny`/`xxs` are
# accepted aliases for mini; `xs`/`extra-small`/`extrasmall` for xsmall.
#
# Unset means "per mode", not "medium": `input` gets mini, the one size that
# fits the ordinary three-row composer, and every other mode gets medium, where
# the rows come out of the transcript and a smaller robot buys nothing.
#
# The grids are 6x1, 7x2, 8x4, 10x5 and 21x10 cells, needing a terminal of at
# least 8x9, 9x10, 10x12, 12x13 and 23x18 respectively. Below `small` the robot
# is a silhouette and its cyan eye: the generator drops its emptiness threshold
# and leans on the eye to keep even that. Overridden by `--mascot-size`.
# mascot_size = "medium"

# left or right. Unset means "whatever the mode wants", which is left for
# `place` and right for everything else -- running on the spot facing right,
# directly above a left-to-right input box, reads as walking into a wall.
#
# Only `loop` and `place` honour this. `type` sets its own orientation (it
# turns upside down while deleting) and `input` is never mirrored. Overridden
# by `--mascot-facing`.
# mascot_facing = "right"

# Movement pace from 0 (still) through 10 (fastest). Unset means the regular
# pace, 5. Overridden by `--mascot-speed`.
# mascot_speed = 5

# capability_gate and inert_gate are omitted here on purpose: both already
# default to true in src/config.zig, so writing them out does nothing except
# invite drift if the struct default ever changes and this file is not
# updated to match.
[improve]
max_context_requests = 5
plan_phase = true
