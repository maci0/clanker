<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clanker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230969da'/%3E%3Cg stroke='%23fff' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 11l5 5-5 5'/%3E%3Cpath d='M17.5 21H24'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --rule: #21262d;
    --fg: #e6edf3;
    --fg-muted: #9198a1;
    --accent: #58a6ff;
    --on-accent: #041024;
    --danger: #ff7b72;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --step-0: 0.75rem;
    --step-1: 1rem;
    --step-2: 1.25rem;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --surface: #f6f8fa;
      --border: #d0d7de;
      --rule: #e4e8ec;
      --fg: #1f2328;
      --fg-muted: #57606a;
      --accent: #0969da;
      --on-accent: #ffffff;
      --danger: #cf222e;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: var(--step-1);
    line-height: 1.5;
  }

  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem;
    padding: 0.9rem 1.5rem; border-bottom: 1px solid var(--rule);
  }
  h1 {
    font-family: var(--mono); font-size: var(--step-2); font-weight: 700;
    letter-spacing: -0.02em; margin: 0; color: var(--accent);
  }
  .chip {
    font-family: var(--mono); font-size: var(--step-0);
    padding: 0.15rem 0.5rem; border-radius: 999px;
    background: var(--surface); color: var(--fg-muted);
  }
  .chip[data-state="down"] { color: var(--danger); }

  main { max-width: 56rem; margin: 0 auto; padding: 1.5rem; }

  label {
    display: block; font-size: var(--step-0); font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--fg-muted); margin-bottom: 0.5rem;
  }
  textarea {
    width: 100%; min-height: 6rem; padding: 0.75rem;
    font-family: var(--mono); font-size: var(--step-1); line-height: 1.5;
    background: var(--surface); color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; resize: vertical;
  }
  ::placeholder { color: var(--fg-muted); opacity: 1; }
  .toolbar {
    display: flex; flex-wrap: wrap; justify-content: space-between;
    align-items: center; gap: 0.75rem; margin-top: 0.75rem;
  }
  button {
    min-height: 44px; padding: 0.5rem 1.25rem;
    font-family: var(--sans); font-size: var(--step-1); font-weight: 600;
    color: var(--on-accent); background: var(--accent);
    border: 0; border-radius: 6px; cursor: pointer;
  }
  button.secondary {
    font-size: var(--step-0); padding: 0.5rem 0.9rem;
    background: var(--surface); color: var(--fg-muted);
    border: 1px solid var(--border);
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .meta { font-family: var(--mono); font-size: var(--step-0); color: var(--fg-muted); }

  .result {
    font-family: var(--mono); font-size: var(--step-1);
    white-space: pre-wrap; overflow-wrap: anywhere;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 1rem; margin: 1rem 0 0; min-height: 3rem;
  }
  .result[hidden] { display: none; }
  .result .failed { color: var(--danger); }
  /* The one authored motion moment: the caret marks a live stream. */
  .caret {
    display: inline-block; width: 0.6ch; height: 1em; vertical-align: text-bottom;
    background: var(--accent); animation: caret 1.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
  }
  @keyframes caret { 50% { opacity: 0.15; } }
  @media (prefers-reduced-motion: reduce) {
    .caret { animation: none; opacity: 0.6; }
  }

  section { margin-top: 2.5rem; border-top: 1px solid var(--rule); padding-top: 1.25rem; }
  .section-head { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
  h2 {
    font-size: var(--step-0); font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--fg-muted); margin: 0;
  }
  dl { display: grid; grid-template-columns: 8rem 1fr; gap: 0.5rem 1rem; margin: 1.25rem 0 0; }
  dt { font-size: var(--step-0); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-muted); }
  dd { font-family: var(--mono); font-size: var(--step-1); margin: 0; overflow-wrap: anywhere; }
  dd ul { margin: 0; padding-left: 1.1rem; }
  a { color: var(--accent); overflow-wrap: anywhere; }

  @media (max-width: 40rem) {
    header { padding: 0.9rem 1rem; }
    main { padding: 1rem; }
    dl { grid-template-columns: 1fr; gap: 0.25rem; }
    dt { margin-top: 0.75rem; }
    .toolbar button { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>clanker</h1>
  <span class="chip" id="instance-chip">connecting…</span>
  <span class="chip" id="peers-chip" hidden></span>
</header>

<main>
  <form id="task-form">
    <label for="task">Task</label>
    <textarea id="task" name="task" placeholder="Summarize the provider config…" required></textarea>
    <div class="toolbar">
      <span class="meta" id="hint"></span>
      <button type="submit" id="submit" disabled>Run (Ctrl+Enter)</button>
    </div>
    <noscript><p class="meta">Running a task needs JavaScript. Without it, use <code>clanker run "&lt;task&gt;"</code> from the shell.</p></noscript>
  </form>

  <pre class="result" id="result" role="status" aria-live="polite" aria-atomic="false" hidden></pre>

  <section>
    <div class="section-head">
      <h2>Status</h2>
      <button type="button" class="secondary" id="refresh">Refresh</button>
    </div>
    <dl role="status" aria-live="polite">
      <dt>Instance</dt>
      <dd id="instance">…</dd>
      <dt>Peers</dt>
      <dd id="peers">…</dd>
    </dl>
  </section>
</main>

<script>
(function () {
  "use strict";

  var el = {
    form: document.getElementById("task-form"),
    task: document.getElementById("task"),
    submit: document.getElementById("submit"),
    refresh: document.getElementById("refresh"),
    hint: document.getElementById("hint"),
    result: document.getElementById("result"),
    instance: document.getElementById("instance"),
    instanceChip: document.getElementById("instance-chip"),
    peers: document.getElementById("peers"),
    peersChip: document.getElementById("peers-chip")
  };

  var busy = false;

  function syncControls() {
    el.submit.disabled = busy || el.task.value.trim() === "";
    el.refresh.disabled = busy;
    el.task.readOnly = busy;
    el.submit.textContent = busy ? "Running…" : "Run (Ctrl+Enter)";
    el.result.setAttribute("aria-busy", String(busy));
    document.title = busy ? "Running… · clanker" : "clanker";
  }

  function setBusy(next) {
    busy = next;
    syncControls();
  }

  /* Appended, never assigned over: a stream that fails mid-flight keeps the
     tokens it already delivered. */
  function append(text, failed) {
    el.result.hidden = false;
    var node = document.createTextNode(text);
    if (failed) {
      var span = document.createElement("span");
      span.className = "failed";
      span.appendChild(node);
      node = span;
    }
    var caret = el.result.querySelector(".caret");
    if (caret) el.result.insertBefore(node, caret);
    else el.result.appendChild(node);
  }

  function showCaret(on) {
    var caret = el.result.querySelector(".caret");
    if (on && !caret) {
      caret = document.createElement("span");
      caret.className = "caret";
      caret.setAttribute("aria-hidden", "true");
      el.result.appendChild(caret);
    } else if (!on && caret) {
      caret.remove();
    }
  }

  function renderStatus(status) {
    if (!status) {
      el.instanceChip.textContent = "disconnected";
      el.instanceChip.dataset.state = "down";
      el.peersChip.hidden = true;
      el.instance.textContent = "unreachable (is `clanker serve` still running?)";
      el.peers.textContent = "unknown";
      return;
    }
    var peers = status.peers || [];
    el.instanceChip.textContent = status.instance.name;
    delete el.instanceChip.dataset.state;
    el.peersChip.hidden = peers.length === 0;
    el.peersChip.textContent = peers.length + (peers.length === 1 ? " peer" : " peers");
    el.instance.textContent = status.instance.name + " (" + status.instance.id + ")";

    el.peers.textContent = "";
    if (peers.length === 0) {
      el.peers.textContent = "none configured";
      return;
    }
    var list = document.createElement("ul");
    peers.forEach(function (p) {
      var item = document.createElement("li");
      var name = document.createElement("b");
      name.textContent = p.name;
      item.appendChild(name);
      item.appendChild(document.createTextNode(": "));
      /* Peer URLs come from config.json; only http(s) becomes a live link so a
         hand-edited javascript: URL cannot be clicked into execution. */
      if (/^https?:\/\//i.test(p.url)) {
        var link = document.createElement("a");
        link.href = p.url;
        link.textContent = p.url;
        item.appendChild(link);
      } else {
        item.appendChild(document.createTextNode(p.url));
      }
      list.appendChild(item);
    });
    el.peers.appendChild(list);
  }

  function loadStatus() {
    return fetch("/api/status")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(renderStatus)
      .catch(function () { renderStatus(null); });
  }

  el.task.addEventListener("input", syncControls);

  el.task.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      el.form.requestSubmit();
    }
  });

  el.refresh.addEventListener("click", function () {
    el.refresh.disabled = true;
    loadStatus().finally(function () { el.refresh.disabled = busy; });
  });

  el.form.addEventListener("submit", function (e) {
    e.preventDefault();
    var task = el.task.value.trim();
    if (busy || task === "") return;

    setBusy(true);
    el.result.textContent = "";
    el.result.hidden = false;
    el.hint.textContent = "";
    showCaret(true);
    var startedAt = Date.now();

    fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task: task, stream: true })
    }).then(function (resp) {
      if (!resp.ok || !resp.body) throw new Error("server responded HTTP " + resp.status);
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      return (function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) return;
          append(decoder.decode(chunk.value, { stream: true }), false);
          return pump();
        });
      })();
    }).then(function () {
      el.hint.textContent = "finished in " + (Date.now() - startedAt) + "ms";
      el.task.value = "";
    }).catch(function (err) {
      append("\n[run failed: " + err.message + "]\n", true);
      el.hint.textContent = "failed after " + (Date.now() - startedAt) + "ms";
    }).finally(function () {
      showCaret(false);
      setBusy(false);
    });
  });

  setBusy(false);
  loadStatus();
})();
</script>
</body>
</html>
