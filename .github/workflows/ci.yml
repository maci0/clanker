name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  # Weekly run on an unchanged tree: npm audit findings and toolchain
  # breakage appear without a commit to surface them.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Same pinned environment for every job. The fixed epoch keeps timestamps in
# build artifacts and the release SBOM (generated only in release-publish,
# which previously ran without it and emitted a live timestamp) from varying
# with the calendar day the CI job ran.
env:
  NO_COLOR: "1"
  LC_ALL: C
  TZ: UTC
  SOURCE_DATE_EPOCH: "1704067200"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version`: setup-zig resolves it from build.zig.zon's
      # minimum_zig_version, so the pin lives in one place. `use-cache`
      # already caches ~/.cache/zig and redirects local caches there; a
      # separate actions/cache step on the same directory was redundant.
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          use-cache: true

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # Both toolchains: tools/ts (audit + verify.sh) and the root one
          # whose oxlint the Lint JavaScript step runs.
          cache-dependency-path: |
            tools/ts/package-lock.json
            package-lock.json

      # Glob from the index instead of a hand-kept list: a new script is
      # checked from its first commit, not from when someone remembers to
      # add it here. `.githooks/pre-commit` is a tracked shell script with no
      # .sh suffix and nothing ever executes it in CI, so it would rot
      # silently if this glob left it out.
      - name: Check shell scripts
        run: git ls-files -z '*.sh' '.githooks/pre-commit' | xargs -0 -r shellcheck

      # oxlint over ui/ and tools/ts sources. Correctness-category rules are
      # errors here and block the job; the anti-slop rules in .oxlintrc.json
      # are warn-level with a recorded debt, so they stay visible without
      # failing until paid down.
      - name: Lint JavaScript
        run: |
          npm ci
          npm run lint

      # The root lockfile (oxlint and its napi bindings) gets the same audit
      # the AssemblyScript toolchain gets below; nothing else scanned it.
      - name: Audit root JavaScript toolchain
        run: npm audit --audit-level=high

      - name: Audit AssemblyScript toolchain
        working-directory: tools/ts
        run: |
          npm audit --audit-level=high
          ./verify.sh

      # Smoke-tests scripts/sbom.py against every manifest it reads, so a
      # format change in build.zig.zon, the lockfile, or a vendored README
      # surfaces here instead of at release time.
      - name: Check SBOM generation
        run: python3 scripts/sbom.py -o /tmp/sbom.cdx.json

      # Python is a secondary language here (sbom.py, gen_frames.py, ...),
      # and nothing in CI executes most of it, so a syntax error would merge
      # unseen. Compile-check every tracked .py with ast.parse: py_compile
      # would litter the checkout with __pycache__ dirs (not gitignored).
      - name: Compile-check Python scripts
        run: git ls-files -z '*.py' | xargs -0 -r python3 -c 'import ast,pathlib,sys; [ast.parse(pathlib.Path(p).read_bytes()) for p in sys.argv[1:]]'

      - name: Run deterministic gate
        run: |
          zig build
          ./zig-out/bin/clanker gate

      - name: Run end-to-end tests
        run: zig build e2e

      - name: Verify release contract
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          zig build -Doptimize=ReleaseSafe
          ./scripts/release-check.sh "${GITHUB_REF_NAME}" zig-out/bin/clanker

  # build.zig once hard-pinned x86_64-linux and produced unrunnable binaries
  # on arm64 macs; this job is the regression guard for that promise.
  # `zig build test` pulls in the wasm tools build (the sandbox tests load
  # zig-out/tools/*.wasm), so this covers native + wasm compilation and the
  # full unit-test suite. Lint, shellcheck, npm audit and e2e stay
  # linux-only: they check sources, not the host target.
  verify-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          use-cache: true

      # `zig build test` runs the ~20 node --test suites under ui/app, so the
      # runner's floating preinstalled Node would test against whatever version
      # the image happens to ship. Pin .nvmrc here too, like the linux verify
      # job; no npm cache is warmed because nothing on this job runs npm.
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Build and run unit tests
        run: |
          zig build
          zig build test

  # Cross-compiles one release binary per target from a single native runner
  # (Zig's cross-compiler needs no target SDK for these), so the release
  # matrix does not need a runner per architecture. Only the target that
  # matches the runner's own architecture can be smoke-tested by running it;
  # the others are trusted to the build succeeding, same as any cross build.
  release-build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, verify-macos]
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux-musl
            runnable: true
          - os: ubuntu-24.04
            target: aarch64-linux-musl
            runnable: false
          - os: macos-15
            target: aarch64-macos
            runnable: true
          - os: macos-15
            target: x86_64-macos
            runnable: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          use-cache: true

      - name: Build release binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} --prefix "out/${{ matrix.target }}"

      - name: Verify release contract
        if: matrix.runnable
        run: ./scripts/release-check.sh "${GITHUB_REF_NAME}" "out/${{ matrix.target }}/bin/clanker"

      - name: Rename binary
        run: mv "out/${{ matrix.target }}/bin/clanker" "out/${{ matrix.target }}/bin/clanker-${GITHUB_REF_NAME}-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clanker-${{ matrix.target }}
          path: out/${{ matrix.target }}/bin/clanker-*
          if-no-files-found: error

  # One immutable tag becomes one GitHub Release with every target's binary
  # attached, so installing clanker never needs a Zig toolchain.
  # contents:write is scoped to this job only; every other job keeps the
  # workflow's read-only default.
  release-publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # The changelog is the source of release notes: extract the section
      # between this version's heading and the next `## [` heading (whichever
      # comes first, Unreleased or the prior version), so notes never drift
      # from what CHANGELOG.md already says happened.
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "no CHANGELOG.md section for $version" >&2; exit 1; }

      # One SBOM per immutable tag, generated from the tagged source tree so
      # it always describes exactly what that release shipped. `dist/*` below
      # attaches it to the GitHub Release alongside the binaries.
      - name: Generate software bill of materials
        run: python3 scripts/sbom.py -o dist/sbom.cdx.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
