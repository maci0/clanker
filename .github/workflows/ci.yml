name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
          use-cache: true

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/ts/package-lock.json

      - name: Check shell scripts
        run: |
          shellcheck \
            clanker-improve.sh \
            clanker-merge-worktree.sh \
            clanker-review.sh \
            release-check.sh \
            tools/grammars/build.sh \
            tools/ts/verify.sh

      - name: Audit AssemblyScript toolchain
        working-directory: tools/ts
        run: |
          npm audit --audit-level=high
          ./verify.sh

      - name: Run deterministic gate
        run: |
          zig build
          ./zig-out/bin/clanker gate

      - name: Run end-to-end tests
        run: zig build e2e

      - name: Verify release contract
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          zig build -Doptimize=ReleaseSafe
          ./release-check.sh "${GITHUB_REF_NAME}" zig-out/bin/clanker
