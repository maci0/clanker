name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  # Weekly run on an unchanged tree: bun audit findings and toolchain
  # breakage appear without a commit to surface them.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  # The release path must never be cancelled mid-publish. A tag push and a
  # manual re-dispatch of the same tag share this group, so `true` here would
  # let the second run kill the first partway through `gh release upload`,
  # leaving a Release carrying a subset of the matrix binaries — the exact
  # half-published state the "Verify every target reached the Release" step
  # checks for, discovered only after the cancel. Ordinary pushes and PRs keep
  # the fast cancel. Queueing a tag run rather than cancelling it cannot wedge
  # the ref for good: every job here carries a `timeout-minutes`, so the queued
  # run starts once the running one is killed by its own budget.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Same pinned environment for every job. The fixed epoch keeps timestamps in
# build artifacts and the release SBOM (generated only in release-publish,
# which previously ran without it and emitted a live timestamp) from varying
# with the calendar day the CI job ran.
env:
  NO_COLOR: "1"
  LC_ALL: C
  TZ: UTC
  SOURCE_DATE_EPOCH: "1704067200"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Zig version comes from build.zig.zon (read, not restated), so the
      # pin still lives in exactly one place. setup-zig does not read that file
      # itself: left without `version` it installs the newest 0.16.x it can
      # find, and a compiler bump changes codegen on an unchanged tree, which
      # is the one drift a reproducibility claim cannot absorb.
      - name: Resolve Zig version
        id: zigpin
        run: |
          version=$(sed -n 's/.*minimum_zig_version = "\(.*\)".*/\1/p' build.zig.zon)
          [ -n "$version" ] || { echo "build.zig.zon has no minimum_zig_version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.zigpin.outputs.version }}
          # use-cache already caches ~/.cache/zig and redirects local caches
          # there; a separate actions/cache step on the same directory was
          # redundant.
          use-cache: true

      # The bun version comes from `packageManager` in package.json (read, not
      # restated), the same one-place pin the Zig version gets above: a bun
      # bump in package.json used to leave the two `bun-version: 1.4.2`
      # literals in this file installing the previous release, so CI verified
      # a toolchain the project no longer claims. Left implicit, every job
      # installs whatever bun released that morning, so lint, audit and the
      # AssemblyScript rebuild can all change result on an unchanged tree.
      - name: Resolve Bun version
        id: bunpin
        run: |
          version=$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"bun@\([^"]*\)".*/\1/p' package.json)
          [ -n "$version" ] || { echo "package.json has no packageManager bun pin" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bunpin.outputs.version }}

      # This job installs dependencies three times: the root install below, the
      # AssemblyScript rebuild in tools/ts/verify.sh, and the Tailwind rebuild
      # in ui/app/verify-css.sh (which re-runs the root install). Each one
      # refetched every tarball into an empty runner cache. setup-zig has
      # `use-cache` for the Zig global cache and this is the same idea for
      # bun's global install cache, so a run that changes no lockfile restores
      # them instead of re-downloading. Keyed by both lockfiles and the pinned
      # bun version: the toolchain release changes what resolves out of the
      # same cache, so a bun bump is a miss rather than a stale hit. The
      # restore-keys prefix degrades to the newest cache with the same
      # toolchain, which is what a lockfile edit should get.
      #
      # Only the download cache is kept, not node_modules/: the lockfile is the
      # input that decides the tree, and node_modules carries no result of its
      # own that `bun install --frozen-lockfile` would not reproduce.
      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ steps.bunpin.outputs.version }}-${{ hashFiles('bun.lock', 'tools/ts/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ steps.bunpin.outputs.version }}-

      # Extract the pinned dependency trees and re-apply patches/*.patch
      # (patches/README.md). build.zig refuses to configure against pristine
      # upstream vaxis/zwasm, and apply-patches.sh cannot patch trees that
      # were not extracted yet — `--fetch=all` extracts without compiling, so
      # this ordering closes that trap. Idempotent; safe to repeat.
      - name: Apply dependency patches
        run: |
          zig build --fetch=all
          ./scripts/apply-patches.sh

      # Glob from the index instead of a hand-kept list: a new script is
      # checked from its first commit, not from when someone remembers to
      # add it here. `.githooks/pre-commit` is a tracked shell script with no
      # .sh suffix and nothing ever executes it in CI, so it would rot
      # silently if this glob left it out.
      - name: Check shell scripts
        run: git ls-files -z '*.sh' '.githooks/pre-commit' | xargs -0 -r shellcheck

      # YAML is the language the rest of this file is written in, and nothing
      # parsed it: a workflow that does not parse, or one carrying a duplicated
      # key (the last duplicate silently wins, so a typo'd step looks
      # configured), reached this job as a red X on someone else's PR rather
      # than as a finding here. yamllint ships on ubuntu runners, so no
      # install step is needed. .yamllint.yml enables the defect rules and
      # disables the whitespace style this tree does not follow; the config
      # carries why for each. Globbed from the index for the same reason the
      # shellcheck step above is.
      - name: Check YAML
        run: git ls-files -z '*.yml' '*.yaml' | xargs -0 -r yamllint -c .yamllint.yml

      # oxlint over ui/ and tools/ts sources with every rule at error (the
      # Rika Labs strict preset, type-aware, plus anti-slop and @shadcn/lint).
      # tools/oxlint/ratchet.ts fails the job when any file's count for a rule
      # rises above tools/oxlint/baseline.json, or falls without the baseline
      # being tightened, and on a disable directive that silences nothing.
      # scripts/brand.ts --check fails when docs/brand/ or the favicon and
      # masthead in ui/app/index.html differ from a fresh build.
      - name: Lint JavaScript
        run: |
          bun install --frozen-lockfile
          bun test tools/oxlint
          bun run lint
          bun scripts/brand.ts --check

      # oxlint is type-aware, but a type-aware lint rule is not a type check:
      # it answers the rules it carries and stays silent on the rest, so
      # tsconfig.json (`strict`) described a configuration no job ever ran and
      # the only spelling in use was `bunx tsc`, which resolves whatever the
      # network serves that day. The pinned devDependency is one tree every run.
      - name: Type-check JavaScript
        run: bun run typecheck

      # The root lockfile (oxlint and its napi bindings) gets the same audit
      # the AssemblyScript toolchain gets below; nothing else scanned it.
      - name: Audit root JavaScript toolchain
        run: bun audit --audit-level=high

      - name: Audit AssemblyScript toolchain
        working-directory: tools/ts
        run: |
          bun audit --audit-level=high
          ./verify.sh

      # ui/app/tailwind.css is the other committed build artifact, so it gets
      # the same rebuild-and-diff the AssemblyScript output gets. A Tailwind
      # minor under the old `^4` range could restyle a class the source had
      # settled on; the exact pins and this check close that.
      - name: Check Tailwind CSS build output
        run: ./ui/app/verify-css.sh

      # Smoke-tests scripts/sbom.py against every manifest it reads, so a
      # format change in build.zig.zon, the lockfile, or a vendored README
      # surfaces here instead of at release time. The scratch file goes to
      # $RUNNER_TEMP, not /tmp: on the ubuntu image /tmp is a tmpfs, so the
      # document is written to RAM for no benefit, and the project's own rule
      # (AGENTS.md, the reason scripts/verify.sh writes under .scratch/) is the
      # same one.
      - name: Check SBOM generation
        run: |
          python3 -B -m unittest scripts.test_sbom
          python3 scripts/sbom.py -o "${RUNNER_TEMP}/sbom.cdx.json"

      # `state/` is the only copy of every conversation, goal and ledger this
      # harness keeps, and scripts/backup-state.sh + scripts/verify-backup.sh
      # are the only things that make it recoverable. Nothing else in the
      # build runs their tests, so a regression here would reach a machine as
      # the first sign of an incident. The installer is here for the same
      # reason: it decides where both units read their settings from, and a
      # path no unit reads configures nothing while looking configured.
      - name: Check state backup and restore drills
        run: |
          python3 -B -m unittest scripts.test_backup_state scripts.test_verify_backup \
            scripts.test_install_state_backup

      # scripts/check-threat-model.py re-resolves every file:line reference in
      # docs/THREAT_MODEL.md against the tree and exits non-zero on any that
      # moved. The document asserts in its own header that this is what keeps
      # it honest, so the claim is only worth as much as something running it:
      # nothing in the build, the pre-commit hook or the other suites invoked
      # either it or its tests, which is how it reached 98 stale references
      # while its test module sat unrun in the tree. The unit test covers the
      # resolution rules and pins the shipped model clean.
      - name: Check threat model references
        run: |
          python3 -B -m unittest scripts.test_check_threat_model
          python3 scripts/check-threat-model.py

      # scripts/release-checksum.sh is the last gate before a tag becomes a
      # published release: release-publish runs `verify` on the merged artifact
      # directory and refuses to attach anything whose sidecars do not check
      # out. Nothing in the build ran its tests, so a regression that turned it
      # into a step that passes on a dist holding fewer binaries than the
      # release is made of would ship a release quietly missing an
      # architecture -- the exact failure it exists to prevent.
      - name: Check release checksum contract
        run: python3 -B -m unittest scripts.test_release_checksum

      # The ruff release is read from ruff.toml rather than restated here, the
      # same one-place pin the Zig and bun steps take. The literal used to live
      # only in the run block below, so the pre-commit hook and
      # scripts/verify.sh ran whatever ruff was on PATH and could disagree with
      # CI on an unchanged tree; `required-version` now refuses a mismatch.
      - name: Resolve Ruff version
        id: ruffpin
        run: |
          version=$(sed -n 's/^[[:space:]]*required-version[[:space:]]*=[[:space:]]*"==\(.*\)".*/\1/p' ruff.toml)
          [ -n "$version" ] || { echo "ruff.toml has no required-version pin" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Python is a secondary language here (sbom.py, gen_frames.py, ...),
      # and nothing in CI executes most of it, so a defect would merge unseen.
      # ruff parses every tracked .py (a syntax error is a finding, so this
      # also covers what the ast.parse compile check used to) and enforces
      # ruff.toml, which pins the selected rules, the line cap and
      # `required-version` so a ruff upgrade cannot turn CI red on a tree
      # nobody changed. The release is read out of that same file above rather
      # than restated: a pin in one file and an install of another is how the
      # local `ruff` on a contributor's PATH and this job end up being two rule
      # sets.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"

      - name: Lint Python
        run: |
          git ls-files -z '*.py' | xargs -0 -r uvx "ruff==${{ steps.ruffpin.outputs.version }}" check

      # `zig build fmt` is the repo-wide `zig fmt --check` over every tree
      # holding committed .zig (build.zig owns that path list). `clanker gate`
      # and the pre-commit hook only format-check the files a proposal or a
      # staged set touches, so on a merge to main neither of them looks at the
      # rest of the checkout and a misformatted file reaches the trunk.
      - name: Check Zig formatting
        run: zig build fmt

      - name: Run deterministic gate
        run: |
          zig build
          ./zig-out/bin/clanker gate

      - name: Run end-to-end tests
        run: zig build e2e

      - name: Verify release contract
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          zig build -Doptimize=ReleaseSafe
          ./scripts/release-check.sh "${GITHUB_REF_NAME}" zig-out/bin/clanker

  # build.zig once hard-pinned x86_64-linux and produced unrunnable binaries
  # on arm64 macs; this job is the regression guard for that promise.
  # `zig build test` pulls in the wasm tools build (the sandbox tests load
  # zig-out/tools/*.wasm), so this covers native + wasm compilation and the
  # full unit-test suite. Lint, shellcheck and bun audit stay linux-only:
  # they check sources, not the host target.
  #
  # `zig build e2e` runs here too, which is the exception to that rule and the
  # reason it needs saying: the pty journeys drive the real binary through a
  # real terminal, so they are host-target-dependent by construction, and
  # tests/e2e/pty.zig exists mostly to make them possible off Linux (a
  # /dev/ptmx + TIOCSPTLCK/TIOCGPTN allocation is Linux-only, and a master is
  # not a terminal on Darwin until something opens the slave). Every macOS
  # branch in that module was therefore unexercised by CI, on a platform
  # every release ships a binary for. See the 0.5.0 changelog entry that
  # replaced the Linux-only pty allocation.
  verify-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pin as the linux jobs, read from the same one place.
      - name: Resolve Zig version
        id: zigpin
        run: |
          version=$(sed -n 's/.*minimum_zig_version = "\(.*\)".*/\1/p' build.zig.zon)
          [ -n "$version" ] || { echo "build.zig.zon has no minimum_zig_version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.zigpin.outputs.version }}
          use-cache: true

      # `zig build test` runs the ~20 bun test suites under ui/app, so bun must
      # be on PATH here too, like the linux verify job, on the pin package.json
      # carries.
      - name: Resolve Bun version
        id: bunpin
        run: |
          version=$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"bun@\([^"]*\)".*/\1/p' package.json)
          [ -n "$version" ] || { echo "package.json has no packageManager bun pin" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bunpin.outputs.version }}

      # Same reason as the verify job: build.zig refuses pristine upstream
      # dependencies, and the patches must land after extraction.
      - name: Apply dependency patches
        run: |
          zig build --fetch=all
          ./scripts/apply-patches.sh

      - name: Build and run unit tests
        run: |
          zig build
          zig build test

      - name: Run end-to-end tests
        run: zig build e2e

  # Cross-compiles one release binary per target from a single native runner
  # (Zig's cross-compiler needs no target SDK for these), so the release
  # matrix does not need a runner per architecture. Only the target that
  # matches the runner's own architecture can be smoke-tested by running it;
  # the others are trusted to the build succeeding, same as any cross build.
  release-build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, verify-macos]
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux-musl
            runnable: true
          - os: ubuntu-24.04
            target: aarch64-linux-musl
            runnable: false
          - os: macos-15
            target: aarch64-macos
            runnable: true
          - os: macos-15
            target: x86_64-macos
            runnable: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pin as the other jobs, read from the same one place.
      - name: Resolve Zig version
        id: zigpin
        run: |
          version=$(sed -n 's/.*minimum_zig_version = "\(.*\)".*/\1/p' build.zig.zon)
          [ -n "$version" ] || { echo "build.zig.zon has no minimum_zig_version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ steps.zigpin.outputs.version }}
          use-cache: true

      # Same reason as the verify job: build.zig refuses pristine upstream
      # dependencies, and the patches must land after extraction.
      - name: Apply dependency patches
        run: |
          zig build --fetch=all
          ./scripts/apply-patches.sh

      - name: Build release binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} --prefix "out/${{ matrix.target }}"

      - name: Verify release contract
        if: matrix.runnable
        run: ./scripts/release-check.sh "${GITHUB_REF_NAME}" "out/${{ matrix.target }}/bin/clanker"

      - name: Rename binary
        run: |
          mv "out/${{ matrix.target }}/bin/clanker" "out/${{ matrix.target }}/bin/clanker-${GITHUB_REF_NAME}-${{ matrix.target }}"
          # Record what this target's bytes are, next to the bytes. The
          # `clanker-*` upload path picks the sidecar up with the binary, and
          # release-publish refuses to attach a release whose sidecars do not
          # verify, so a truncated download or a matrix leg that never
          # uploaded is visible instead of looking like a healthy release.
          ./scripts/release-checksum.sh create "out/${{ matrix.target }}/bin/clanker-${GITHUB_REF_NAME}-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clanker-${{ matrix.target }}
          path: out/${{ matrix.target }}/bin/clanker-*
          if-no-files-found: error
          # release-publish attaches the same bytes to the GitHub Release
          # minutes later, so the 90-day default only keeps superseded builds
          # (and a failed publish's binaries) alive for a quarter.
          retention-days: 7

  # One immutable tag becomes one GitHub Release with every target's binary
  # attached, so installing clanker never needs a Zig toolchain.
  # contents:write is scoped to this job only; every other job keeps the
  # workflow's read-only default.
  release-publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Nothing above has re-derived these bytes: the matrix built and
      # checksummed them in a different runner, artifacts cross a store in
      # between, and the release below is immutable. Verify every sidecar
      # against the merged tree, and refuse to publish if a binary arrived
      # without one.
      - name: Verify artifact checksums
        run: ./scripts/release-checksum.sh verify dist

      # The release-wide half of the release contract, run here rather than
      # only in the matrix: `release-check.sh` needs a runnable binary for its
      # `--version` half, and two of the four targets are cross-compiled, so
      # their bytes would reach the Release with nothing having compared this
      # tag to build.zig.zon. The `manifests` mode is that half without the
      # binary, and this job — the last one before anything is created — is the
      # cheapest place to refuse a release describing a version other than its
      # tag.
      - name: Verify release contract
        run: ./scripts/release-check.sh manifests "${GITHUB_REF_NAME}"

      # The changelog is the source of release notes: extract the section
      # between this version's heading and the next `## [` heading (whichever
      # comes first, Unreleased or the prior version), so notes never drift
      # from what CHANGELOG.md already says happened.
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || { echo "no CHANGELOG.md section for $version" >&2; exit 1; }

      # One SBOM per immutable tag, generated from the tagged source tree so
      # it always describes exactly what that release shipped. `dist/*` below
      # attaches it to the GitHub Release alongside the binaries.
      - name: Generate software bill of materials
        run: python3 scripts/sbom.py -o dist/sbom.cdx.json

      # `gh release create` refuses a tag that already carries a release, so a
      # re-run of this job after a later step failed (or after the create
      # itself succeeded and the response never arrived) died permanently and
      # left the operator deleting the release by hand before the retry could
      # attach anything. Converge instead: upload onto whatever release the tag
      # already carries, replacing any file of the same name (`--clobber`), so
      # a re-run finishes the job rather than starting a manual repair. The
      # bytes are identical on both paths — same tag, same matrix, checksums
      # verified above — so overwriting one changes nothing a consumer sees.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; uploading onto it"
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi

      # `--clobber` deletes the assets it is about to replace *before* it
      # uploads them, and gh documents the consequence directly: "if the upload
      # fails, the original assets will be lost". On the create path that only
      # costs the bytes; on the re-run path it empties a release that already
      # carried every target, and the tag is immutable so no later build can
      # put them back. `gh release upload` still exits 0 when it replaces what
      # is there, so nothing upstream notices.
      #
      # So read the asset list back and compare it to what was in dist/. A
      # release missing a target then fails here, naming it, rather than
      # passing a green publish on an install that cannot succeed.
      - name: Verify every target reached the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release-checksum.sh targets > "$RUNNER_TEMP/ck-targets"
          present=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          missing=""
          # Word splitting is what is wanted here: a target has no whitespace,
          # and the same list drives the check inside release-checksum.sh.
          # shellcheck disable=SC2013
          for target in $(cat "$RUNNER_TEMP/ck-targets"); do
            echo "$present" | grep -q -- "-${target}\$" || missing="$missing $target"
          done
          if [ -n "$missing" ]; then
            echo "release ${GITHUB_REF_NAME} has no binary for:$missing" >&2
            echo "upload the missing assets by hand: gh release upload ${GITHUB_REF_NAME} dist/* --clobber" >&2
            exit 1
          fi
          echo "every matrix target is attached to ${GITHUB_REF_NAME}"
