name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  # Weekly run on an unchanged tree: npm audit findings and toolchain
  # breakage appear without a commit to surface them.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `version`: setup-zig resolves it from build.zig.zon's
      # minimum_zig_version, so the pin lives in one place. `use-cache`
      # already caches ~/.cache/zig and redirects local caches there; a
      # separate actions/cache step on the same directory was redundant.
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          use-cache: true

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/ts/package-lock.json

      # Glob from the index instead of a hand-kept list: a new script is
      # checked from its first commit, not from when someone remembers to
      # add it here.
      - name: Check shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      - name: Audit AssemblyScript toolchain
        working-directory: tools/ts
        run: |
          npm audit --audit-level=high
          ./verify.sh

      - name: Run deterministic gate
        run: |
          zig build
          ./zig-out/bin/clanker gate

      - name: Run end-to-end tests
        run: zig build e2e

      - name: Verify release contract
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          zig build -Doptimize=ReleaseSafe
          ./release-check.sh "${GITHUB_REF_NAME}" zig-out/bin/clanker

  # build.zig once hard-pinned x86_64-linux and produced unrunnable binaries
  # on arm64 macs; this job is the regression guard for that promise.
  # `zig build test` pulls in the wasm tools build (the sandbox tests load
  # zig-out/tools/*.wasm), so this covers native + wasm compilation and the
  # full unit-test suite. Lint, shellcheck, npm audit and e2e stay
  # linux-only: they check sources, not the host target.
  verify-macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      NO_COLOR: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          use-cache: true

      - name: Build and run unit tests
        run: |
          zig build
          zig build test
