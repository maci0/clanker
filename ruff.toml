# Python is a secondary language here (scripts/, the mascot and plugin
# generators, the SBOM writer), and CI used to only ast.parse these files, so
# every defect-class rule was off by omission rather than by decision. The
# selection below is explicit for the same reason: a default set that grows
# with a ruff upgrade would turn CI red on a tree nobody changed.
#
# `EXE` is deliberately absent: these scripts carry a shebang but are run as
# `python3 scripts/sbom.py` and the `opencv` guest is exec'd by its tool
# manifest, so a non-executable bit is not a defect here.
# The version the selection below was verified against, in the one place CI and
# `scripts/verify.sh` both read. Without it a contributor's local ruff and CI's
# pinned ruff are two rule sets, and the divergence only shows up after a push.
required-version = "==0.16.4"
line-length = 100
target-version = "py310"
# The one place the ruff version is written down. CI reads it from here
# instead of restating a literal, and every `ruff check` (CI, the pre-commit
# hook, scripts/verify.sh) refuses to run on any other version, so a checkout
# that verifies green locally verified the same rules CI will.
required-version = "0.16.4"

[lint]
select = [
    "A",   # flake8-builtins: a parameter or local named after a builtin
    "B",   # bugbear: mutable defaults, bare except shapes
    "BLE", # blind except; only the one deliberate tool top-level catch is exempt
    "C4",  # comprehensions
    "DTZ", # naive datetime: a local-time stamp that never was a UTC instant
    "E",   # pycodestyle errors
    "ERA", # commented-out code left behind by a debug session
    "F",   # pyflakes
    "G",   # logging-format calls
    "I",   # import order
    "ISC", # implicit string concatenation, where a missing `+` is invisible
    "LOG", # misuse of the logging module
    "N",   # pep8-naming
    "PERF", # perflint: a comprehension or a list where a generator will do
    "PIE", # misc lints
    "RET", # return-path bugs (bare else after return, unnecessary else)
    "RSE", # raise spelled wrongly
    "RUF", # ruff-specific correctness
    "SIM", # simplifications that read as intent
    "SLF", # private-member access that binds this package to itself
    "TID", # import tidying beyond ordering
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[lint.per-file-ignores]
# The tool's whole contract is "any failure becomes {"ok": false, ...}" for
# the agent to read, so the top-level catch is the design, not an oversight.
"tools/py/opencv.py" = ["BLE001"]
